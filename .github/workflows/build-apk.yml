
# Builds a debug APK on GitHub's runners and uploads it as a downloadable artifact.
#
# How to use:
#   1. Push this project to a GitHub repo (the repo root should contain settings.gradle.kts,
#      OR the project may live in a MirageDetect/ subfolder — both are handled).
#   2. Open the repo on GitHub → Actions tab → "Build APK" workflow.
#   3. Click "Run workflow" (or just push a commit to main).
#   4. When the run finishes, open the run and download the "app-debug-apk" artifact.
#   5. Unzip the artifact — inside is app-debug.apk, ready to install on any Android 7.0+ phone.

name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate project root
        id: locate
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "root=$PWD" >> "$GITHUB_OUTPUT"
          elif [ -f "MirageDetect/settings.gradle.kts" ]; then
            echo "root=$PWD/MirageDetect" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find settings.gradle.kts at repo root or MirageDetect/"
            exit 1
          fi

      - name: Verify project root
        run: echo "Building from ${{ steps.locate.outputs.root }}"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Write local.properties
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List output APKs
        if: always()
        working-directory: ${{ steps.locate.outputs.root }}
        run: find app/build/outputs -type f -name "*.apk" || echo "No APKs produced"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.locate.outputs.root }}/app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 30
